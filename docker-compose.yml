# baseline.md çıkış kriteri: `docker compose up` ile ayağa kalkıyor.
#
# Kendine yeterli: dışarıda hiçbir servise bağlı değil. Telemetriyi bir OTel
# Collector'ına göndermek istersen .env'de OTEL_EXPORTER_OTLP_ENDPOINT tanımla —
# tanımlı değilse exporter hiç eklenmiyor ve uygulamalar sessizce çalışıyor.
#
# Parolalar .env'den gelir (`cp .env.example .env`), compose onu kendi dizininden
# otomatik okur.
#
# On uygulama. İstemci ön API'lere bağlanıyor; wallet-api ve orchestrator iç
# servis (CLAUDE.md "Deployable'lar"). Webhook'lar ve ingress'siz olanlar erişim
# seviyesine göre ayrılmış (decisions.md madde 28):
#
#   personal-mobile-api      public ingress   — ön API: bireysel mobil uygulama
#   business-api             public ingress   — ön API: işyerinin sistem entegrasyonu
#   business-web-bff         public ingress   — ön API: işyeri panelinin BFF'i
#   backoffice-bff           iç ağ            — ön API: backoffice panelinin BFF'i
#   wallet-api               iç ağ            — ön API'lerin çağırdığı cüzdan servisi
#   topup-webhook            kısıtlı ingress  — yalnızca sağlayıcı IP'leri (proxy işi)
#   bank-webhook             kısıtlı ingress  — yalnızca bankanın IP'leri
#   wallet-consumer          ingress YOK      — mesajları kendisi kuyruktan çekiyor
#   withdrawal-orchestrator  iç ağ            — çekim saga'sı
#   bank-adapter             ingress YOK      — bankayı kendisi arıyor
#
# Kimlik sağlayıcı Keycloak: token'ı o imzalıyor, ön API'ler ve iç servisler
# doğruluyor. Bizim kodumuz değil ama canlıda da koşuyor; kendi Postgres'i var.
#
# İç ağdaki servislerin portları burada elle denemek için host'a açık; canlıda
# yalnızca iç ağdan erişiliyorlar.
#
# Ve iki tane de BİZİM OLMAYAN (ikisi de `fakes/` altında, `src/` altında DEĞİL):
#
#   bank-fake                bankanın API'si — para girişi VE çıkışı; CANLIDA YOK
#   stripe-fake              kart sağlayıcısı — yalnızca para girişi; CANLIDA YOK
#
# Son ekin ölçütü "test amaçlı mı" değil, "başka bir kurumun yerine mi duruyor"
# (decisions.md madde 35). bank-adapter da bugün yalnızca burada koşuyor ama
# canlıda da koşacak; o yüzden son ek almıyor.
#
# İki çift ayrı deployable ama tek kod tabanı:
#   wallet-api + wallet-consumer  → WalletService.Core
#   bank-adapter + bank-webhook   → BankIntegration.Core
#
# Dört veritabanı: her servis sınırı kendi şemasında. Orchestrator wallet
# tablolarına yazamıyor — saga'nın anlamı buna bağlı (madde 7 ve 33). Sahte
# servislerin veritabanı YOK: bank-fake'in hafızası bellekte ve yeniden
# başlatınca siliniyor (madde 35).

# Bağlantı havuzu bütçesi. Altı uygulama AYNI Postgres örneğine bakıyor ve
# `max_connections` örnek bazında, veritabanı bazında DEĞİL — yani havuzlar
# toplanıyor. Postgres'in varsayılanı 100; sınırsız bırakılan her servis
# Npgsql'in varsayılanı olan 100'ü isteyebilir ve altısı birden 600'e çıkar.
# O noktada havuz tükenmeden ÖNCE Postgres "too many connections" der.
#
#   wallet-api                30   ön API'lerin trafiği, en yüksek eşzamanlılık
#   wallet-consumer           16   prefetch=1, sıralı tüketim
#   withdrawal-orchestrator   16   API + tüketici + relay + job
#   topup-webhook             10   IP kısıtlı, yalnızca inbox yazıyor
#   bank-adapter              10   tüketici + iki relay + tarama
#   bank-webhook               6   yalnızca inbox yazıyor, en dar yüzey
#                            ───
#                             88   psql ve izleme için ~12 pay kalıyor
#
# Sahte servisler ve ön API'ler bütçede YOK: veritabanı bağlantısı hiç açmıyorlar.
#
# 88, 100'e fazla yaklaşıyor. Bunu kabul etmenin şartı Postgres'in
# max_connections'ının yükseltilmesi; aşağıda postgres servisinde 200 veriliyor.
# Yükseltilmeseydi doğru yol havuzları kısmak olurdu, sınırı görmezden gelmek
# değil.
#
# Migrator'lar geçici ve uygulamalardan ÖNCE bitiyor (service_completed_successfully),
# bu yüzden bütçeye girmiyorlar.
#
# `Application Name` de her bağlantıya işleniyor: pg_stat_activity'de "bu bağlantıyı
# kim tutuyor" sorusu ancak onunla cevaplanabiliyor.

name: hiwallet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env'de tanımlı değil}
      POSTGRES_DB: postgres
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:?WALLET_OWNER_PASSWORD .env'de tanımlı değil}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:?WALLET_APP_PASSWORD .env'de tanımlı değil}
      TOPUP_APP_PASSWORD: ${TOPUP_APP_PASSWORD:?TOPUP_APP_PASSWORD .env'de tanımlı değil}
      WITHDRAWAL_APP_PASSWORD: ${WITHDRAWAL_APP_PASSWORD:?WITHDRAWAL_APP_PASSWORD .env'de tanımlı değil}
      BANK_APP_PASSWORD: ${BANK_APP_PASSWORD:?BANK_APP_PASSWORD .env'de tanımlı değil}
    # Havuz bütçesi 88 (dosyanın başı); varsayılan 100 psql'e yer bırakmıyor.
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      # Yalnızca veri dizini BOŞKEN çalışır. Rolleri/parolaları değiştirmek için
      # volume'u düşürmek gerekiyor: docker compose down -v
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      # .sql initdb.d DIŞINDA: postgres o dizindeki .sql dosyalarını da kendisi
      # çalıştırıyor, script iki kez koşardı (ikincisinde parola değişkenleri
      # tanımsız olduğu için hata vererek).
      - ./docker/postgres-init.sql:/opt/hiwallet/postgres-init.sql:ro
      # Integration testlerin veritabanı, AYRI dosyada. Canlı kurulumunda bu
      # satır olmaz ve init betiği dosyayı bulamayıp atlar.
      - ./docker/postgres-init-tests.sql:/opt/hiwallet/postgres-init-tests.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Host'tan pgAdmin/psql ile bakabilmek için. 5432 mevcut bir Postgres'te olabilir.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      # migrator ve app bunu bekliyor. pg_isready YETMEZ: gerçekten bağlanmıyor,
      # yalnızca ping atıyor ve init bitmeden "hazır" diyebiliyor. Gerçek bir sorgu
      # hem sunucuyu hem veritabanının VAR OLDUĞUNU doğruluyor. Uygulama
      # kurulumunun SONUNCU veritabanı soruluyor; test veritabanı bilerek değil,
      # canlıda o dosya mount edilmiyor.
      test: ["CMD-SHELL", "psql -U postgres -d hiwallet_bank -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  rabbitmq:
    # Standart imaj x-consistent-hash exchange'ini GETİRMİYOR; eklenti dosyayla
    # etkinleştiriliyor. Onsuz topoloji declare'i PRECONDITION_FAILED veriyor.
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMq__Username:?RabbitMq__Username .env'de tanımlı değil}
      RABBITMQ_DEFAULT_PASS: ${RabbitMq__Password:?RabbitMq__Password .env'de tanımlı değil}
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      # Kuyruklar durable; volume olmadan konteyner yeniden yaratıldığında
      # yayınlanmış ama işlenmemiş mesajlar kaybolurdu.
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_HOST_PORT:-5673}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-15673}:15672"
    healthcheck:
      # "Süreç ayakta mı" değil, "protokol cevap veriyor mu". Eklenti yüklenirken
      # broker birkaç saniye yanıt vermiyor ve o aralıkta bağlanan servis düşerdi.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Keycloak'ın veritabanı, uygulamalarınkinden AYRI container. Uygulama
  # Postgres'inin kurulum betiği yalnızca veri dizini boşken koşuyor; kalıcı bir
  # ortama sonradan eklenen rol ve veritabanı orada hiç oluşmazdı. Kimlik verisi
  # de para verisinden ayrı duruyor. Havuz bütçesine bu yüzden girmiyor.
  keycloak-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD .env'de tanımlı değil}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U keycloak -d keycloak -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Kimlik sağlayıcı. Realm dosyası yalnızca realm YOKKEN içe aktarılıyor: var olan
  # realm'e yapılan değişiklik dosyadan gelmiyor, yönetim konsolundan ya da realm
  # silinip yeniden aktarılarak yapılıyor.
  #
  # Realm dosyasında yalnızca compose'a ait dört ayar var: sslRequired "none" (burada
  # düz HTTP konuşuluyor, canlıda "all"), hiwallet-cli istemcisi (curl ile token almak
  # için parola akışı), merchant-demo istemcisi (örnek işyeri entegrasyonu) ve api-docs
  # istemcisi (Scalar'da müşteri girişi). Üç istemci de canlıda YOK; canlıda her
  # işyerinin entegrasyonu kendi istemcisini alıyor.
  #
  # Çalışanların realm'i ayrı dosyada (realm-hiwallet-staff.json): kayıt sayfası kapalı,
  # kullanıcıyı yönetici açıyor; roller iş grubuna göre. Girişte OTP'yi keycloak-setup
  # zorunlu kılıyor.
  #
  # Adı hiwallet-keycloak: ters proxy arkasında yayında kapı (hiwallet-gateway) hem bu
  # ağda hem proxy'nin ağında. O ağ başka projelerle ortak ve orada keycloak adlı başka
  # bir konteyner olabilir; kapı aynı adı iki konteynere çözerdi.
  hiwallet-keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD .env'de tanımlı değil}
      KC_DB_POOL_MAX_SIZE: "10"
      # Token'daki issuer bu adres: istemcinin Keycloak'a ulaştığı adres. Servisler
      # anahtarları iç ağdan (hiwallet-keycloak:8080) okuyor; backchannel dinamik olduğu için
      # iç adresten gelen isteğe iç adresler dönüyor, issuer değişmiyor.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD .env'de tanımlı değil}
      # Realm dosyasındaki ${MERCHANT_DEMO_CLIENT_SECRET} buradan dolduruluyor; secret
      # dosyaya yazılmıyor.
      MERCHANT_DEMO_CLIENT_SECRET: ${MERCHANT_DEMO_CLIENT_SECRET:?MERCHANT_DEMO_CLIENT_SECRET .env'de tanımlı değil}
      # BFF'lerin gizli anahtarları; realm dosyaları buradan dolduruyor.
      BACKOFFICE_CLIENT_SECRET: ${BACKOFFICE_CLIENT_SECRET:?BACKOFFICE_CLIENT_SECRET .env'de tanımlı değil}
      PERSONAL_WEB_CLIENT_SECRET: ${PERSONAL_WEB_CLIENT_SECRET:?PERSONAL_WEB_CLIENT_SECRET .env'de tanımlı değil}
      # Kayıt servisinin istemcisi: kullanıcı açıyor ve wallet-api'yi kendi kimliğiyle çağırıyor.
      ONBOARDING_CLIENT_SECRET: ${ONBOARDING_CLIENT_SECRET:?ONBOARDING_CLIENT_SECRET .env'de tanımlı değil}
      # Realm dosyasındaki ${PROXY_DOMAIN}: ters proxy arkasında yayında Scalar'ın
      # adresleri (docker-compose.proxy.yml). Proxy yoksa localhost; o adresler yerelde
      # hiçbir yere gitmiyor.
      PROXY_DOMAIN: ${PROXY_DOMAIN:-localhost}
    volumes:
      - ./docker/keycloak/realm-hiwallet.json:/opt/keycloak/data/import/realm-hiwallet.json:ro
      - ./docker/keycloak/realm-hiwallet-staff.json:/opt/keycloak/data/import/realm-hiwallet-staff.json:ro
      # Giriş sayfasının görünümü (realm'de loginTheme: hiwallet). Akış Keycloak'ın.
      - ./docker/keycloak/themes/hiwallet:/opt/keycloak/themes/hiwallet:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8101}:8080"
    healthcheck:
      # İmajda curl ve wget yok; bash'in /dev/tcp'si ile yönetim portu soruluyor.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Çalışanların realm'inde OTP'yi zorunlu kılan tek seferlik iş
  # (docker/keycloak/setup-staff-realm.sh). Keycloak sağlıklıyken, yani realm'ler içe
  # aktarıldıktan sonra koşuyor; her açılışta aynı sonucu veriyor.
  keycloak-setup:
    image: quay.io/keycloak/keycloak:26.7.4
    entrypoint: ["/bin/bash", "/opt/setup/setup-staff-realm.sh"]
    depends_on:
      hiwallet-keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://hiwallet-keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD .env'de tanımlı değil}
    volumes:
      - ./docker/keycloak/setup-staff-realm.sh:/opt/setup/setup-staff-realm.sh:ro
    restart: "no"

  # Müşteri kaydı ve kimlik doğrulaması. İÇ SERVİS: ön API'ler (personal-web-bff,
  # personal-mobile-api) çağırıyor. Kişisel veri (e-posta, telefon, TCKN, onaylar)
  # kendi Postgres sunucusunda, ledger'la aynı yerde değil. Keycloak'ta kullanıcıyı
  # açıyor, wallet'ta hesabı; ikisine de kendi istemcisinin token'ıyla gidiyor.
  onboarding-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: onboarding_owner
      POSTGRES_PASSWORD: ${ONBOARDING_OWNER_PASSWORD:?ONBOARDING_OWNER_PASSWORD .env'de tanımlı değil}
      POSTGRES_DB: hiwallet_onboarding
      ONBOARDING_APP_PASSWORD: ${ONBOARDING_APP_PASSWORD:?ONBOARDING_APP_PASSWORD .env'de tanımlı değil}
    volumes:
      - onboarding-postgres-data:/var/lib/postgresql/data
      - ./docker/onboarding/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U onboarding_owner -d hiwallet_onboarding -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Şemayı sahibi olarak uygulayan tek seferlik iş; uygulama onboarding_app ile bağlanıyor.
  onboarding-migrator:
    build:
      context: .
      dockerfile: src/Onboarding/Dockerfile
      target: migrator
    depends_on:
      onboarding-postgres:
        condition: service_healthy
    command:
      - --connection
      - Host=onboarding-postgres;Port=5432;Database=hiwallet_onboarding;Username=onboarding_owner;Password=${ONBOARDING_OWNER_PASSWORD}
    restart: "no"

  onboarding:
    build:
      context: .
      dockerfile: src/Onboarding/Dockerfile
      target: final
    depends_on:
      onboarding-migrator:
        condition: service_completed_successfully
      # Keycloak, wallet-api ve sahteler BEKLENMİYOR: onlarsız da açılıyor ve adım
      # onlara ulaşana kadar 503 dönüyor.
      hiwallet-keycloak:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Onboarding: Host=onboarding-postgres;Port=5432;Database=hiwallet_onboarding;Username=onboarding_app;Password=${ONBOARDING_APP_PASSWORD};Application Name=hiwallet-onboarding;Maximum Pool Size=16
      # Kullanıcı açmak ve kendi token'ını almak için iç ağdan.
      Keycloak__BaseUrl: http://hiwallet-keycloak:8080
      Keycloak__ClientSecret: ${ONBOARDING_CLIENT_SECRET:?ONBOARDING_CLIENT_SECRET .env'de tanımlı değil}
      InternalServices__WalletApi__BaseUrl: http://wallet-api:8080
      # E-posta Mailpit'e gidiyor; gönderilen her şey onun arayüzünde.
      Email__Host: mailpit
      Email__Port: "1025"
      Email__UseStartTls: "false"
      Email__From: HiWallet <kayit@hiwallet.test>
      Sms__BaseUrl: http://sms-fake:8080
      PopulationRegistry__BaseUrl: http://nvi-fake:8080
      # Doğrulama uçlarında müşterinin token'ı; ön API iletiyor, burada yeniden doğrulanıyor.
      Authentication__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet
      Authentication__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet/.well-known/openid-configuration
      Authentication__Audience: hiwallet-api
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-onboarding
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ONBOARDING_HOST_PORT:-8103}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # SMS SAĞLAYICISININ YERİNDE DURAN SAHTE SERVİS, canlıda YOK. Mesajı göndermiyor,
  # kutusunda tutuyor: doğrulama kodu GET /v1/messages?to=+905... ile okunuyor.
  sms-fake:
    build:
      context: .
      dockerfile: fakes/Sms.Fake/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-sms-fake
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${SMS_FAKE_HOST_PORT:-8104}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # NÜFUS KAYDININ YERİNDE DURAN SAHTE SERVİS, canlıda YOK. Biçimi geçerli her kimlik
  # numarası eşleşiyor; eşleşmemesi istenen numara POST /v1/scenarios ile.
  nvi-fake:
    build:
      context: .
      dockerfile: fakes/Nvi.Fake/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-nvi-fake
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${NVI_FAKE_HOST_PORT:-8105}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # E-POSTA SAĞLAYICISININ YERİNDE, canlıda YOK. SMTP'yi kabul ediyor, hiçbir şeyi
  # dışarı göndermiyor; gelen e-postalar web arayüzünde. Kayıt kodu ve Keycloak'ın
  # parola sıfırlama e-postası buraya düşüyor. Kod SMTP konuştuğu için değişmiyor:
  # canlıda yalnızca Email__Host ve kimlik bilgileri değişiyor.
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "${MAILPIT_HOST_PORT:-8106}:8025"
      # dotnet run ile yerelden gönderebilmek için.
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"

  # Wallet şemasını uygulayan tek seferlik iş. wallet_owner ile koşuyor —
  # uygulamalar wallet_app ile bağlanacak ve ledger_entries üzerindeki REVOKE ancak
  # sahip OLMAYAN bir role işliyor (decisions.md madde 5).
  #
  # Dockerfile'ı Core'da: şema iki host'un da değil, kütüphanenin.
  migrator:
    build:
      context: .
      dockerfile: src/WalletService.Core/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --connection
      - Host=postgres;Port=5432;Database=hiwallet_wallet;Username=wallet_owner;Password=${WALLET_OWNER_PASSWORD}
    restart: "no"

  # topup-webhook'un kendi veritabanı, kendi migration'ı. Tek rol: burada
  # append-only zorlanacak bir tablo yok.
  topup-migrator:
    build:
      context: .
      dockerfile: src/TopupWebhook/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --connection
      - Host=postgres;Port=5432;Database=hiwallet_topup;Username=topup_app;Password=${TOPUP_APP_PASSWORD}
    restart: "no"

  # Orchestrator'ın kendi veritabanı: withdrawal_sagas ve withdrawal_outbox.
  # Wallet şemasına DOKUNMUYOR.
  withdrawal-migrator:
    build:
      context: .
      dockerfile: src/WithdrawalOrchestrator/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --connection
      - Host=postgres;Port=5432;Database=hiwallet_withdrawal;Username=withdrawal_app;Password=${WITHDRAWAL_APP_PASSWORD}
    restart: "no"

  # Banka entegrasyonunun şeması: bank_transfers ve bank_callbacks. Sahibi
  # BankIntegration.Core; bundle'ı bank-adapter'ın Dockerfile'ı üretiyor.
  # bank-webhook AYRI migrator açmıyor — iki host aynı şema için ayrı bundle
  # üretseydi hangisinin önce koştuğu şemayı belirlerdi.
  bank-migrator:
    build:
      context: .
      dockerfile: src/BankAdapter/Dockerfile
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - --connection
      - Host=postgres;Port=5432;Database=hiwallet_bank;Username=bank_app;Password=${BANK_APP_PASSWORD}
    restart: "no"

  # İç servis: ön API'ler çağırıyor. RabbitMQ ayarı YOK ve olmamalı: tüketici ayrı
  # bir host'a taşındıktan sonra bu uygulamanın broker'a hiç işi kalmadı.
  wallet-api:
    build:
      context: .
      dockerfile: src/WalletApi/Dockerfile
      target: final
    depends_on:
      # Migration BİTMEDEN başlamamalı; yoksa ilk istek "relation does not exist" alır.
      migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Wallet: Host=postgres;Port=5432;Database=hiwallet_wallet;Username=wallet_app;Password=${WALLET_APP_PASSWORD};Application Name=hiwallet-wallet-api;Maximum Pool Size=30
      # Token doğrulama. Issuer token'daki public adres, anahtarlar iç ağdan.
      Authentication__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet
      Authentication__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet/.well-known/openid-configuration
      Authentication__Audience: hiwallet-api
      # Çalışanların realm'i: backoffice'ten gelen token.
      Authentication__Staff__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet-staff
      Authentication__Staff__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet-staff/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
      # Tanımlı değilse OTel exporter hiç eklenmiyor; collector'sız çalışmak sorun değil.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      # Servis adı BİLEREK sabit, .env'den okunmuyor: tek bir OTEL_SERVICE_NAME
      # değişkeni üç uygulamayı da aynı isimle etiketlerdi.
      OTEL_SERVICE_NAME: hiwallet-wallet-api
    extra_hosts:
      # Collector container'ın DIŞINDA, Docker host'unda çalışıyorsa host'un adı
      # container içinde çözülmez; host-gateway ile host'un IP'sine takma ad veriliyor.
      # Böylece OTLP endpoint'i http://host.docker.internal:4317 olarak yazılabiliyor.
      - "host.docker.internal:host-gateway"
    ports:
      # 8080 ve 8090 geliştirme makinelerinde çoğu zaman dolu; varsayılan 8091.
      # Sende de doluysa .env'den değiştir.
      - "${WALLET_HOST_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # SIGTERM'de in-flight işlerin bitmesi için. Uygulamanın ShutdownTimeout'u 15 sn;
    # compose bundan önce SIGKILL göndermemeli (baseline.md madde 10).
    stop_grace_period: 20s

  # Ön API'ler. Bağlantı dizesi YOK: veritabanına bağlanmıyorlar, ledger'a giden her
  # istek wallet-api'den geçiyor.
  #
  # Bireysel müşterinin mobil uygulaması.
  personal-mobile-api:
    build:
      context: .
      dockerfile: src/PersonalMobileApi/Dockerfile
      target: final
    depends_on:
      # Sağlıklı olmaları BEKLENMİYOR: ön API onlarsız da açılıyor ve iç servis
      # dönene kadar istemciye 503 veriyor.
      wallet-api:
        condition: service_started
      withdrawal-orchestrator:
        condition: service_started
      onboarding:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # İç ağdaki adresler. Eksikse uygulama açılmıyor.
      InternalServices__WalletApi__BaseUrl: http://wallet-api:8080
      InternalServices__WithdrawalOrchestrator__BaseUrl: http://withdrawal-orchestrator:8080
      InternalServices__Onboarding__BaseUrl: http://onboarding:8080
      # Token doğrulama. Issuer token'daki public adres, anahtarlar iç ağdan. Hedef
      # kitle bu ön API'nin adı: yalnızca kendisi için verilmiş token'ı kabul ediyor.
      Authentication__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet
      Authentication__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet/.well-known/openid-configuration
      Authentication__Audience: personal-mobile-api
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-personal-mobile-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PERSONAL_MOBILE_HOST_PORT:-8097}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # Bireysel müşterinin web uygulamasının BFF'i. Uygulamanın sayfalarını da bu host
  # sunuyor; tarayıcı yalnızca oturum cookie'si taşıyor. Token'lar cookie'nin içinde,
  # BFF'in anahtarıyla şifreli; anahtarlar volume'da, yeniden başlatınca oturumlar
  # kapanmıyor.
  personal-web-bff:
    build:
      context: .
      dockerfile: src/PersonalWebBff/Dockerfile
      target: final
    depends_on:
      # Sağlıklı olmaları BEKLENMİYOR: ön API onlarsız da açılıyor ve iç servis
      # dönene kadar istemciye 503 veriyor.
      wallet-api:
        condition: service_started
      withdrawal-orchestrator:
        condition: service_started
      onboarding:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      InternalServices__WalletApi__BaseUrl: http://wallet-api:8080
      InternalServices__WithdrawalOrchestrator__BaseUrl: http://withdrawal-orchestrator:8080
      InternalServices__Onboarding__BaseUrl: http://onboarding:8080
      # Keycloak'taki istemci. Giriş sayfası tarayıcının gördüğü adreste, discovery
      # ve token ucu iç ağdan.
      Authentication__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet
      Authentication__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
      Authentication__ClientSecret: ${PERSONAL_WEB_CLIENT_SECRET:?PERSONAL_WEB_CLIENT_SECRET .env'de tanımlı değil}
      Authentication__KeysDirectory: /app/keys
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-personal-web-bff
    volumes:
      - personal-web-bff-keys:/app/keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cookie yalnızca HTTPS'te ya da localhost'ta yazılıyor: başka bir makineden bu
    # portla girilemiyor, ters proxy arkasındaki adres kullanılıyor.
    ports:
      - "${PERSONAL_WEB_BFF_HOST_PORT:-8102}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # İşyerinin sistem entegrasyonu: çağıran işyerinin sunucusu, her istekte token taşır.
  business-api:
    build:
      context: .
      dockerfile: src/BusinessApi/Dockerfile
      target: final
    depends_on:
      # Sağlıklı olmaları BEKLENMİYOR: ön API onlarsız da açılıyor ve iç servis
      # dönene kadar istemciye 503 veriyor.
      wallet-api:
        condition: service_started
      withdrawal-orchestrator:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # İç ağdaki adresler. Eksikse uygulama açılmıyor.
      InternalServices__WalletApi__BaseUrl: http://wallet-api:8080
      InternalServices__WithdrawalOrchestrator__BaseUrl: http://withdrawal-orchestrator:8080
      # Entegrasyon istemcisinin token'ı (client credentials). Hedef kitle bu ön API'nin adı.
      Authentication__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet
      Authentication__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet/.well-known/openid-configuration
      Authentication__Audience: business-api
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-business-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BUSINESS_HOST_PORT:-8098}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # İşyeri panelinin BFF'i: tek istemcisi tarayıcıdaki panel.
  business-web-bff:
    build:
      context: .
      dockerfile: src/BusinessWebBff/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-business-web-bff
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BUSINESS_WEB_BFF_HOST_PORT:-8100}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # Backoffice panelinin BFF'i. Canlıda yalnızca iç ağdan erişiliyor; port burada elle denemek için
  # host'a açık.
  backoffice-bff:
    build:
      context: .
      dockerfile: src/BackofficeBff/Dockerfile
      target: final
    depends_on:
      wallet-api:
        condition: service_started
      withdrawal-orchestrator:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      InternalServices__WalletApi__BaseUrl: http://wallet-api:8080
      InternalServices__WithdrawalOrchestrator__BaseUrl: http://withdrawal-orchestrator:8080
      # Çalışanların realm'indeki istemci. Giriş sayfası tarayıcının gördüğü adreste,
      # discovery ve token ucu iç ağdan.
      Authentication__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet-staff
      Authentication__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet-staff/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
      Authentication__ClientSecret: ${BACKOFFICE_CLIENT_SECRET:?BACKOFFICE_CLIENT_SECRET .env'de tanımlı değil}
      Authentication__KeysDirectory: /app/keys
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-backoffice-bff
    volumes:
      - backoffice-bff-keys:/app/keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKOFFICE_BFF_HOST_PORT:-8099}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  topup-webhook:
    build:
      context: .
      dockerfile: src/TopupWebhook/Dockerfile
      target: final
    depends_on:
      topup-migrator:
        condition: service_completed_successfully
      # Burada da broker beklenmiyor: webhook'u kabul etmek yalnızca Postgres'e
      # bağlı. Inbox'ın varlık sebebi tam olarak bu.
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Topup: Host=postgres;Port=5432;Database=hiwallet_topup;Username=topup_app;Password=${TOPUP_APP_PASSWORD};Application Name=hiwallet-topup-webhook;Maximum Pool Size=10
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RabbitMq__Username}
      RabbitMq__Password: ${RabbitMq__Password}
      RabbitMq__PartitionCount: ${RABBITMQ_PARTITION_COUNT:-4}
      # Sağlayıcı başına paylaşılan HMAC secret'ı. Sahte webhook'u engelleyen
      # tek şey bu; koda gömülmez.
      Providers__stripe-fake__WebhookSecret: ${STRIPE_FAKE_WEBHOOK_SECRET:?STRIPE_FAKE_WEBHOOK_SECRET .env'de tanımlı değil}
      Providers__bank-fake__WebhookSecret: ${BANK_FAKE_WEBHOOK_SECRET:?BANK_FAKE_WEBHOOK_SECRET .env'de tanımlı değil}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-topup-webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${TOPUP_HOST_PORT:-8092}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Relay bir batch'i yayınlamış ama commit etmemişken kesilirse mesajlar iki kez
    # gider. Tüketici bunu deduplike ediyor ama süre tanımak nadirleştiriyor.
    stop_grace_period: 20s

  # Ingress'i YOK: ports tanımı yalnızca health check endpoint'i için ve host'a AÇILMIYOR.
  # Ledger'a yazan kod artık dışarıdan erişilebilen bir uygulamanın içinde değil.
  wallet-consumer:
    build:
      context: .
      dockerfile: src/WalletConsumer/Dockerfile
      target: final
    depends_on:
      migrator:
        condition: service_completed_successfully
      # wallet-api'nin aksine broker BEKLENİYOR mu? Hayır — tüketici bağlanana
      # kadar kendisi yeniden deniyor (5 sn aralıkla) ve broker'ın uygulamadan
      # sonra kalkması normal bir durum. service_started yeterli.
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # wallet-api ile AYNI veritabanı ve AYNI rol. Application Name farklı:
      # pg_stat_activity'de "bu yükü kim üretiyor" sorusu cevaplanabilsin diye.
      ConnectionStrings__Wallet: Host=postgres;Port=5432;Database=hiwallet_wallet;Username=wallet_app;Password=${WALLET_APP_PASSWORD};Application Name=hiwallet-wallet-consumer;Maximum Pool Size=16
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RabbitMq__Username}
      RabbitMq__Password: ${RabbitMq__Password}
      RabbitMq__PartitionCount: ${RABBITMQ_PARTITION_COUNT:-4}
      # Job aralıkları. Varsayılanlar canlı değerleri; .env'den kısaltmak yalnızca
      # ilk turu gözle görmek için. İlk tur BEKLEMEDEN koşmuyor (ScheduledJob) —
      # kısaltılmazsa mutabakatı görmek için altı saat beklemek gerekirdi.
      Jobs__Reconciliation__Interval: ${JOBS_RECONCILIATION_INTERVAL:-06:00:00}
      Jobs__BusinessSummary__Interval: ${JOBS_BUSINESS_SUMMARY_INTERVAL:-01:00:00}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-wallet-consumer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Host'a port açmadan da çalışıyor: healthcheck container'ın İÇİNDEN koşuyor.
      # Probe olmadan "process ayakta ama tüketici tıkanmış" durumu görünmezdi.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # İşlenmekte olan mesaj bitsin. Bitmezse ack'lenmiyor ve yeniden teslim
    # ediliyor — kayıp değil, sadece gereksiz tekrar.
    stop_grace_period: 20s

  # İç servis: çekim isteği ön API'lerden geliyor. Broker'a hem yazıyor (outbox
  # relay) hem okuyor (saga event'leri).
  withdrawal-orchestrator:
    build:
      context: .
      dockerfile: src/WithdrawalOrchestrator/Dockerfile
      target: final
    depends_on:
      withdrawal-migrator:
        condition: service_completed_successfully
      # Broker BEKLENMİYOR (service_started yeterli): çekim isteğini kabul etmek
      # yalnızca Postgres'e bağlı. Komut outbox'ta birikiyor ve relay broker
      # dönünce boşaltıyor — outbox'ın varlık sebebi tam olarak bu (madde 32).
      rabbitmq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Withdrawal: Host=postgres;Port=5432;Database=hiwallet_withdrawal;Username=withdrawal_app;Password=${WITHDRAWAL_APP_PASSWORD};Application Name=hiwallet-withdrawal-orchestrator;Maximum Pool Size=16
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RabbitMq__Username}
      RabbitMq__Password: ${RabbitMq__Password}
      RabbitMq__PartitionCount: ${RABBITMQ_PARTITION_COUNT:-4}
      # Bkz. wallet-consumer'daki aynı not.
      Jobs__StuckSagaScan__Interval: ${JOBS_STUCK_SAGA_SCAN_INTERVAL:-00:05:00}
      # Token doğrulama. Issuer token'daki public adres, anahtarlar iç ağdan.
      Authentication__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet
      Authentication__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet/.well-known/openid-configuration
      Authentication__Audience: hiwallet-api
      # Çalışanların realm'i: backoffice'ten gelen token.
      Authentication__Staff__Issuer: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8101}/realms/hiwallet-staff
      Authentication__Staff__MetadataAddress: http://hiwallet-keycloak:8080/realms/hiwallet-staff/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-withdrawal-orchestrator
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WITHDRAWAL_HOST_PORT:-8093}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # Relay bir batch'i yayınlamış ama commit etmemişken kesilirse komut iki kez
    # gider. Alıcı taraf deduplike ediyor ama süre tanımak nadirleştiriyor.
    stop_grace_period: 20s

  # BİZİM KODUMUZ, canlıda da koşuyor (decisions.md madde 35).
  #
  # INGRESS'İ YOK: komutu kuyruktan alıyor, bankayı kendisi arıyor. ports tanımı
  # yalnızca health check endpoint'i için ve host'a AÇILMIYOR.
  #
  # Sahtelik tamamen Bank__BaseUrl değerinde; gerçek bankaya geçerken bu servisin
  # kodunda tek satır değişmiyor.
  bank-adapter:
    build:
      context: .
      dockerfile: src/BankAdapter/Dockerfile
      target: final
    depends_on:
      bank-migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
      bank-fake:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Bank: Host=postgres;Port=5432;Database=hiwallet_bank;Username=bank_app;Password=${BANK_APP_PASSWORD};Application Name=hiwallet-bank-adapter;Maximum Pool Size=10
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: ${RabbitMq__Username}
      RabbitMq__Password: ${RabbitMq__Password}
      RabbitMq__PartitionCount: ${RABBITMQ_PARTITION_COUNT:-4}
      # CANLIDA BURAYA BANKANIN KENDİ ADRESİ YAZILIR.
      Bank__BaseUrl: http://bank-fake:8080
      # Mutabakat taraması KAPATILAMAZ, yalnızca aralığı ayarlanır. Compose'da
      # kısa: callback hattını elle bozup taramanın topladığını görebilmek için.
      # Canlı varsayılanı 4 saat (appsettings.json).
      Bank__Reconciliation__Interval: ${BANK_RECONCILIATION_INTERVAL:-00:01:00}
      Bank__Reconciliation__StaleAfter: ${BANK_RECONCILIATION_STALE_AFTER:-00:00:30}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-bank-adapter
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # BİZİM KODUMUZ, canlıda da koşuyor. Bankanın bizi çağırdığı endpoint.
  #
  # AYRI DEPLOYABLE ÇÜNKÜ INGRESS'İ VAR; bank-adapter'ın yok (madde 28). Canlıda
  # yalnızca bankanın IP bloklarına açılır — o kısıt proxy'nin işi, tıpkı
  # topup-webhook'ta olduğu gibi.
  #
  # Broker ayarı YOK ve olmamalı: callback'i kabul etmek yalnızca Postgres'e
  # bağlı. Inbox'ın varlık sebebi tam olarak bu.
  bank-webhook:
    build:
      context: .
      dockerfile: src/BankWebhook/Dockerfile
      target: final
    depends_on:
      bank-migrator:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Bank: Host=postgres;Port=5432;Database=hiwallet_bank;Username=bank_app;Password=${BANK_APP_PASSWORD};Application Name=hiwallet-bank-webhook;Maximum Pool Size=6
      # Bankayla paylaşılan HMAC secret'ı. Sahte callback'i engelleyen tek şey bu;
      # koda gömülmez.
      Banks__bank-fake__CallbackSecret: ${BANK_CALLBACK_SECRET:?BANK_CALLBACK_SECRET .env'de tanımlı değil}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-bank-webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BANK_WEBHOOK_HOST_PORT:-8095}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # BANKANIN YERİNDE DURAN SAHTE SERVİS — BİZİM DEĞİL, CANLIDA YOK.
  # Canlıda bu servisin yerinde bankanın kendi API'si var ve bank-adapter'ın
  # Bank__BaseUrl'ü onun adresini gösteriyor.
  #
  # Host portu açık çünkü senaryo endpoint'i dışarıdan çağrılıyor:
  #   POST /v1/scenarios {"clientReference":"<sagaId>","outcome":"Failure"}
  #
  # RabbitMQ ayarı YOK: bankayla tek bağ HTTP.
  # Veritabanı da YOK: transferler ve senaryolar bellekte. Yeniden başlatınca
  # siliniyor; o anda pending olan çekimler kapanmaz, çünkü banka onları artık
  # tanımıyor.
  bank-fake:
    build:
      context: .
      dockerfile: fakes/Bank.Fake/Dockerfile
      target: final
    depends_on:
      # İki yöne de webhook gönderiyor: sonuç callback'i bank-webhook'a, para
      # girişi topup-webhook'a. Gerçek banka böyle beklemezdi; burada ilk
      # gönderimlerin boşa gitmemesi için (stripe-fake ile aynı gerekçe).
      bank-webhook:
        condition: service_healthy
      topup-webhook:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Senaryosu kurulmamış transferlerin sonucu. Varsayılan başarı; telafi
      # yolunu tüm sistemde göstermek istersen Failure yap.
      BankFake__DefaultOutcome: ${BANK_DEFAULT_OUTCOME:-Success}
      # Sonucun belli olması için geçen süre. SIFIR DEĞİL: sıfır olsaydı asenkron
      # yapının tek gözlemlenebilir tarafı — bank_transfer_pending penceresi —
      # compose'da hiç görünmezdi.
      BankFake__SettlementDelay: ${BANK_SETTLEMENT_DELAY:-00:00:03}
      # ASIL YOL. Kapatırsan sonuç yalnızca mutabakat taramasıyla öğrenilir;
      # durum sorgusu olan ama callback göndermeyen bankaları temsil eder.
      BankFake__Callback__Enabled: ${BANK_CALLBACK_ENABLED:-true}
      BankFake__Callback__Url: http://bank-webhook:8080/v1/webhooks/bank/bank-fake
      BankFake__Callback__Secret: ${BANK_CALLBACK_SECRET}
      # PARA GİRİŞİ tarafı: müşteri havale/EFT ile yüklediğinde banka bize webhook
      # atıyor. Aynı kurum iki yönde de çalışıyor — clearing/bank-fake iki yönde
      # de hareket ediyor.
      Topup__WebhookUrl: http://topup-webhook:8080
      Topup__WebhookSecret: ${BANK_FAKE_WEBHOOK_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-bank-fake
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BANK_HOST_PORT:-8094}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

  # KART SAĞLAYICISININ YERİNDE DURAN SAHTE SERVİS — BİZİM DEĞİL, CANLIDA YOK.
  #
  # Bankadan farkı: yalnızca PARA GİRİŞİ. Stripe'tan para çıkmıyor, o yüzden ne
  # transfer endpoint'i var ne callback alıcısı. Ledger'da nostro'su da yok.
  #
  # VERİTABANI YOK ve migrator'ı da yok: tetikleyen taraf zaten bir test ya da
  # insan, süreç ölürse yeniden tetikliyor.
  stripe-fake:
    build:
      context: .
      dockerfile: fakes/Stripe.Fake/Dockerfile
      target: final
    depends_on:
      # topup-webhook ayakta olmadan webhook gönderilemez. Gerçek Stripe böyle
      # beklemezdi (bizim ayakta olmamız onun sorunu değil) ama burada ilk
      # tetiklemenin boşa gitmemesi için.
      topup-webhook:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Topup__WebhookUrl: http://topup-webhook:8080
      # topup-webhook'taki Providers__stripe-fake__WebhookSecret ile AYNI olmak
      # zorunda; ayrışırsa her webhook 401 alır ve hiç para girmez.
      Topup__WebhookSecret: ${STRIPE_FAKE_WEBHOOK_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_SERVICE_NAME: hiwallet-stripe-fake
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${STRIPE_HOST_PORT:-8096}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    stop_grace_period: 20s

volumes:
  postgres-data:
  rabbitmq-data:
  keycloak-postgres-data:
  onboarding-postgres-data:
  personal-web-bff-keys:
  backoffice-bff-keys:
