# Homelab'a özel ek. Keycloak'ı homelab altyapısının Traefik'inin arkasına koyuyor:
# Traefik TLS'i *.firatergul.com sertifikasıyla sonlandırıyor. Düz HTTP'de yönetim
# konsolu açılmıyor: master realm özel ağ dışından gelen isteğe HTTPS istiyor ve
# Tailscale adresleri (100.x) Keycloak'ın özel ağ listesinde yok.
#
# Homelab'daki .env'de:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.homelab.yml
#   KEYCLOAK_PUBLIC_URL=https://hiwallet-auth.firatergul.com
# COMPOSE_FILE ile her docker compose komutu bu dosyayı da okuyor.
services:
  hiwallet-keycloak:
    environment:
      # İstemcinin adresi ve isteğin HTTPS olduğu Traefik'in X-Forwarded-*
      # başlıklarından okunuyor.
      KC_PROXY_HEADERS: xforwarded
    # Başlıklara güvenen Keycloak'a doğrudan port açık kalırsa başlığı istemci de
    # yazabilir; erişim yalnızca Traefik'ten. Servisler iç ağdan
    # (hiwallet-keycloak:8080) bağlanıyor, porta ihtiyaçları yok.
    ports: !reset []
    networks:
      - default
      - infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hiwallet-keycloak.rule=Host(`hiwallet-auth.firatergul.com`)"
      - "traefik.http.routers.hiwallet-keycloak.entrypoints=websecure"
      - "traefik.http.routers.hiwallet-keycloak.tls=true"
      - "traefik.http.routers.hiwallet-keycloak.tls.certresolver=cloudflare"
      - "traefik.http.services.hiwallet-keycloak.loadbalancer.server.port=8080"

networks:
  infra:
    external: true
